# Which Epiphan MCP tools the agent may call. This file is the single source of truth; it ships inside the
# package, so the list never depends on the folder Fleetwatch starts in (the repo-root tool_policy.yaml is a
# symlink to it). v0.1 is observe-only: only `read` tools are ever called. Any tool not listed under `read`
# is refused by the client guard (src/fleetwatch/epiphan/mcp.py), including tools Epiphan adds later.
# Loading fails if a known write tool is under `read`, or a `read` entry doesn't start with get_ or kb_.
# FLEETWATCH_TOOL_POLICY_FILE may point at a shorter read list; it can only remove tools, never add one.
# The propose section at the end is configuration for v0.2 only; it lets nothing call a write tool.
read:
  - get_devices_in_my_team
  - get_device_info
  - get_device_sources
  - get_system_status_for_devices
  - get_recorder_status_for_devices
  - get_storage_status_for_devices
  - get_channel_settings
  - get_channel_image
  - get_channel_audio_levels
  - get_stream_endpoint
  - get_stream_endpoints
  - get_team_presets
  - get_cms_events_for_device
  - get_cms_events_for_devices
  - get_current_or_next_cms_event_for_device
  - get_current_or_next_cms_events_for_devices
  - get_cms_names_for_devices
  - get_devices_by_cms
  - kb_search
  - kb_fetch

# Listed for the approval flow planned after v0.1. Never called by v0.1.
write:
  - batch_recording
  - start_stream_endpoint
  - stop_stream_endpoint
  - create_cms_event
  - update_cms_event
  - delete_cms_event
  - cms_event_action
  - confirm_cms_event_on_device
  - create_stream_endpoint
  - update_stream_endpoint
  - delete_stream_endpoint
  - apply_team_preset
  - switch_device_to_cms
  - batch_reboot
  - batch_firmware_update

# Writes that take a room offline or interrupt a class. Never on a live room or before an event.
# The last three aren't reviewed yet, so they count as disruptive until they are (docs/design/approved-writes.md).
# batch_recording isn't here: only its stop is disruptive, which its propose entry says per action.
disruptive:
  - batch_reboot
  - batch_firmware_update
  - apply_team_preset
  - stop_stream_endpoint
  - delete_cms_event
  - delete_stream_endpoint
  - switch_device_to_cms
  - update_cms_event
  - cms_event_action

# For v0.2 (docs/design/approved-writes.md): the write tools the assistant may *suggest*, for a person to approve
# one at a time. Nothing in this version reads this section to run anything, and guard() still refuses every
# write tool. A write tool that isn't listed here can never be proposed.
#
# Each entry has:
#   max_targets  how many devices one proposal may touch (1 or more)
#   disruptive   true or false; left out means true. A tool on the disruptive list above can't say false.
#   disruptive_when  optional, with disruptive: true. One enum field of the schema and the values of it that are
#                disruptive, as in {action: [stop]}. Any other known value is calm. A missing or unknown value, or a
#                tool left without this key, counts as disruptive. Not allowed on a tool on the disruptive list.
#   stops_recording  optional. The same shape: the action that ends a recording. Every other disruptive change is
#                refused while the room is recording; this one is refused only for an event on now or inside the window.
#   lead_minutes optional. How long before an event a disruptive call is refused; left out means policy.yaml's
#                lead_minutes. For a tool that can still be running when the event starts, such as a firmware update.
#   schema       the arguments, or pending-live-run. A pending tool loads but can't be proposed.
#
# A reviewed schema looks like this. version starts at 1; raise it whenever that schema's fields change, because
# an approval is bound to the schema version it was made under.
#   schema:
#     version: 1
#     target: device_ids            # the field that names the devices; must be required, with an ID pattern
#     fields:
#       device_ids: {type: list, required: true, max_items: 1, items: {type: string, pattern: "^[0-9a-f]+$"}}
#       action: {type: enum, required: true, values: [start, stop]}
# Field types: string (pattern, max_length), integer (minimum, maximum), boolean, enum (values),
# list (items, max_items). Unknown keys fail the load. check_arguments() in policy.py refuses a missing required
# field, a field the schema doesn't list, a wrong type, a value that doesn't fully match its pattern, and more
# targets than max_targets.
#
# The schemas below come from the Epiphan MCP server's own tool definitions: argument names, types, and which are
# required. The first live run, against the sandbox team, confirms them before v0.2 runs anything.
#
# Device IDs come in two kinds, and the patterns keep them apart, so one can't be passed where the other belongs:
#   master   one device, as in the tool docs' example 19012341234         ^[0-9a-f]{8,32}$
#   channel  one channel on a device: master ID, hyphen, channel number   ^[0-9a-f]{8,32}-[1-9][0-9]{0,2}$
# Real master IDs are all digits. The replay fixtures use renamed IDs such as 1f000000001, which have hex letters,
# so the master pattern takes lower-case hex: wide enough for both, and never a hyphen, so a channel ID can't pass
# as a master ID and a master ID can't pass as a channel ID.
# stream_id is the endpoint's ID, a UUID, not its stream key. redact() keeps a UUID stream_id and masks any other,
# so the pattern only takes a UUID, and the approval card can always show it in full.
#
# Not listed, so never proposed: create_/update_stream_endpoint (their arguments carry stream keys, which a card
# can't show in full); create_/update_/delete_cms_event, cms_event_action, delete_stream_endpoint,
# apply_team_preset and switch_device_to_cms (not reviewed yet).
#
# FLEETWATCH_TOOL_POLICY_FILE may remove entries, lower max_targets, turn disruptive on, widen disruptive_when, raise
# lead_minutes, or set a schema back to pending. It can't add an entry, raise max_targets, turn disruptive off, make a
# disruptive action calm, add stops_recording, shorten lead_minutes, or change a schema. A narrowing file
# with no propose section proposes nothing.
propose:
  batch_recording:
    max_targets: 1
    # Stopping a recording ends a class's capture, so stop is disruptive. Starting one only adds a recording, so
    # it can run while an event is about to start. pause and resume are left out: not every device supports them,
    # and the card can't tell in advance whether this one does.
    # Errors come back as a map of device ID to error; no entry means that device worked.
    disruptive: true
    disruptive_when: {action: [stop]}
    stops_recording: {action: [stop]}  # a stop isn't refused for the recording it ends, only for an event
    schema:
      version: 1
      target: device_ids
      fields:
        action: {type: enum, required: true, values: [start, stop]}
        device_ids:  # channel IDs, as in 19012341234-1
          type: list
          required: true
          max_items: 1
          items: {type: string, pattern: "^[0-9a-f]{8,32}-[1-9][0-9]{0,2}$"}
  start_stream_endpoint:
    max_targets: 1
    disruptive: false
    schema:
      version: 1
      target: device_id
      fields:
        stream_id: {type: string, required: true, pattern: "^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$"}
        device_id: {type: string, required: true, pattern: "^[0-9a-f]{8,32}$"}  # master ID
        channel_id: {type: string, required: true, pattern: "^[1-9][0-9]{0,2}$"}  # the channel's number on it
  stop_stream_endpoint:
    max_targets: 1
    disruptive: true
    schema:
      version: 1
      target: device_id
      fields:
        stream_id: {type: string, required: true, pattern: "^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$"}
        device_id: {type: string, required: true, pattern: "^[0-9a-f]{8,32}$"}  # master ID
        channel_id: {type: string, required: true, pattern: "^[1-9][0-9]{0,2}$"}  # the channel's number on it
  confirm_cms_event_on_device:
    max_targets: 1
    disruptive: false
    schema:
      version: 1
      target: device_id
      fields:
        device_id: {type: string, required: true, pattern: "^[0-9a-f]{8,32}$"}  # master ID
        event_id: {type: string, required: true, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"}
  batch_reboot:
    max_targets: 1
    disruptive: true  # offline for a couple of minutes; recording and streaming stop
    schema:
      version: 1
      target: device_ids
      fields:
        device_ids:  # master IDs, as in 19012341234
          type: list
          required: true
          max_items: 1
          items: {type: string, pattern: "^[0-9a-f]{8,32}$"}
  batch_firmware_update:
    max_targets: 1
    disruptive: true  # the device reboots as part of the update and is offline for a few minutes
    lead_minutes: 120  # an update can still be running well past the usual window
    schema:
      version: 1
      target: device_ids
      fields:
        device_ids:  # master IDs, as in 19012341234
          type: list
          required: true
          max_items: 1
          items: {type: string, pattern: "^[0-9a-f]{8,32}$"}
