name: install-smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "deploy/**"
      - "install.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install dry run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Tier 1 targets: macOS on Apple Silicon (launchd), Linux aarch64 like a Raspberry Pi 5 (systemd).
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run --frozen fleetwatch --help
      - run: deploy/install.sh --dry-run
      - name: One-line installer, from this checkout
        env:
          FLEETWATCH_REPO: ${{ github.workspace }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # PR checkouts are detached; give the clone a branch to check out (already there on main).
          git -C "$FLEETWATCH_REPO" branch --force "$REF" HEAD 2>/dev/null || true
          bash install.sh --dir "$RUNNER_TEMP/fleetwatch" --ref "$REF" --dry-run
          test "$(stat -c %a "$RUNNER_TEMP/fleetwatch/.env" 2>/dev/null || stat -f %Lp "$RUNNER_TEMP/fleetwatch/.env")" = "600"
