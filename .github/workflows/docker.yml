name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR, tags only
      id-token: write # build provenance, tags only
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      # arm64 emulation, so pull requests build the Pi image too (not only release tags).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fleetwatch:ci
      - name: Replay heartbeat inside the image
        run: |
          set -o pipefail
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            fleetwatch:ci digest --replay tests/fixtures | tee digest.txt
          grep -q "Fleet check" digest.txt
          test "$(docker run --rm --entrypoint id fleetwatch:ci -u)" = "10001"
          # The health check is wired in, and reports unhealthy before any heartbeat has run.
          docker inspect --format '{{json .Config.Healthcheck.Test}}' fleetwatch:ci | grep -q 'status'
          if docker run --rm fleetwatch:ci status --check; then echo "expected unhealthy with no heartbeat"; exit 1; fi
      - name: Build for arm64 (Raspberry Pi), emulated
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: fleetwatch:ci-arm64
      - name: Replay heartbeat inside the arm64 image
        run: |
          set -o pipefail
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname fleetwatch:ci-arm64 -m)" = "aarch64"
          docker run --rm --platform linux/arm64 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true fleetwatch:ci-arm64 digest --replay tests/fixtures | tee digest-arm64.txt
          grep -q "Fleet check" digest-arm64.txt

      - name: Image name and tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto: only a final vX.Y.Z moves latest; a pre-release like v0.2.0-rc1 gets only
          # its own 0.2.0-rc1 tag (semver skips {{major}}.{{minor}} for pre-releases), matching install.sh.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch (amd64, arm64 for the Pi)
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image # only after the image is pushed and attested
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "Fleetwatch ${TAG#v}" \
            --notes-file .github/release-notes-header.md
