[project]
name = "proav-agent"
version = "0.1.0"
description = "Always-on, read-only watcher for an Epiphan Edge fleet: heartbeat, Slack digest, pre-class readiness"
readme = "README.md"
authors = [
    { name = "Tim Kipper", email = "tkipper@epiphan.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "slack-sdk>=3.45.0",
]

[project.scripts]
proav-agent = "proav_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
