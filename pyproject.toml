[project]
name = "fleetwatch"
version = "0.1.0"
description = "Fleetwatch for Epiphan Edge: an always-on, read-only watcher for your Pearl and EC20 fleet (heartbeat, Slack digest, pre-class readiness)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["epiphan", "epiphan-edge", "pearl", "ec20", "av-monitoring", "lecture-capture", "mcp", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Monitoring",
]
authors = [
    { name = "Tim Kipper", email = "tkipper@epiphan.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "slack-sdk>=3.45.0",
]

[project.urls]
Homepage = "https://scientiacapital.github.io/fleetwatch/"
Documentation = "https://scientiacapital.github.io/fleetwatch/"
Source = "https://github.com/ScientiaCapital/fleetwatch"
Issues = "https://github.com/ScientiaCapital/fleetwatch/issues"
Security = "https://github.com/ScientiaCapital/fleetwatch/security/policy"

[project.scripts]
fleetwatch = "fleetwatch.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
